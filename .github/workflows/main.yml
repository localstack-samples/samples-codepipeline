name: Run on LocalStack

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Push the CodeBuild image copy to ghcr.io (see "Pull the CodeBuild images")
      packages: write
    strategy:
      fail-fast: false
      matrix:
        sample:
          - 1-codebuild-compile-s3-upload
          - 2-codebuild-test-codeartifact-publish
    defaults:
      run:
        working-directory: ${{ matrix.sample }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # LocalStack stops tracking a build whose image is still downloading,
      # so pull the CodeBuild images (about 17 GB) before starting the pipeline
      - name: Pull the CodeBuild images
        env:
          BUILD_IMAGE: public.ecr.aws/codebuild/amazonlinux-x86_64-standard:5.0
          # Copy of BUILD_IMAGE in this organization's GitHub registry. Anonymous ECR Public pulls come from
          # the runners' shared IPs and fail with "toomanyrequests: Data limit exceeded" once an IP has used
          # its monthly quota, which retries on the same runner cannot fix. Delete the package to refresh it.
          MIRROR_IMAGE: ghcr.io/${{ github.repository_owner }}/codebuild-amazonlinux-x86_64-standard:5.0
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pull() {
            for attempt in 1 2 3 4 5; do
              docker pull -q "$1" && return 0
              [ "$attempt" = 5 ] && return 1
              echo "Pull of $1 failed, retrying in 60s"
              sleep 60
            done
          }
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin || true
          if docker pull -q "$MIRROR_IMAGE"; then
            docker tag "$MIRROR_IMAGE" "$BUILD_IMAGE"
          else
            pull "$BUILD_IMAGE"
            # Fill the copy for later runs (needs packages: write, so it is skipped on fork pull requests)
            docker tag "$BUILD_IMAGE" "$MIRROR_IMAGE"
            docker push -q "$MIRROR_IMAGE" || echo "Could not push $MIRROR_IMAGE, the next run pulls from ECR Public again"
          fi
          pull localstack/aws-codebuild-local:2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install lstk
        run: |
          npm install -g @localstack/lstk
          lstk setup aws --force --non-interactive

      - name: Start LocalStack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          # Forwarded as CODEPIPELINE_GH_TOKEN, used to download the source archives from GitHub
          LOCALSTACK_CODEPIPELINE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lstk start

      - name: Run the pipeline
        env:
          MAX_WAIT_SECONDS: 1200
        run: bash run.sh

      - name: Show pipeline state and LocalStack logs
        if: failure()
        run: |
          lstk aws codepipeline get-pipeline-state --name demo-pipeline || true
          lstk aws codepipeline list-action-executions --pipeline-name demo-pipeline || true
          builds=$(lstk aws codebuild list-builds --query 'ids' --output text || true)
          [ -n "$builds" ] && lstk aws codebuild batch-get-builds --ids $builds \
            --query 'builds[].{id: id, status: buildStatus, phases: phases[].[phaseType, phaseStatus, contexts[0].message]}' || true
          docker ps -a
          docker images
          df -h /
          lstk logs | grep -vE 'ListPipelineExecutions|ListActionExecutions' | tail -400
